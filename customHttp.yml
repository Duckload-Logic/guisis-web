customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: >-
          default-src 'self';
          script-src 'self' https://embed.tawk.to https://*.tawk.to;
          style-src 'self' 'unsafe-inline' https://*.tawk.to;
          img-src 'self' data: blob: https://*.tawk.to;
          connect-src 'self' http://localhost:8080 https://*.dllbsit2027.com
          https://*.tawk.to wss://*.tawk.to;
          frame-src 'self' https://*.tawk.to;
          frame-ancestors 'none';
          form-action 'self';
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'X-Permitted-Cross-Domain-Policies'
        value: 'none'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
