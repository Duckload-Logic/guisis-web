<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>GuiSIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (error) {
          // Ignore if localStorage is unavailable.
        }
      })();
    </script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
